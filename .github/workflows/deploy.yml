name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 Vercel 官方 action · 第一次会自动建项目
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 第一次部署 · 用 --yes --no-clipboard 跳过交互
      # 同时把 stderr 全打出来方便排查
      - name: Deploy to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== PWD: $(pwd)"
          echo "=== LS:"
          ls -la
          echo "=== vercel --version:"
          vercel --version
          echo "=== vercel whoami:"
          vercel whoami --token "$VERCEL_TOKEN" 2>&1 || true
          echo "=== vercel deploy start:"
          vercel deploy --prod --yes --no-clipboard --token "$VERCEL_TOKEN" 2>&1
          echo "=== exit code: $?"
